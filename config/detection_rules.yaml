rules:
  api_key:
    pattern: "(?i)(?:api_key|apikey|access_token|secret_key|client_secret)[a-z0-9_.-]{0,20}['\"]?\\s*[:=]\\s*['\"]?([a-zA-Z0-9_\\-]{16,})['\"]?"
    weight: 10
    type: "Credential"
  jwt:
    pattern: "ey[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"
    weight: 9
    type: "Token"
  credit_card:
    pattern: "\\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|6(?:011|5[0-9][0-9])[0-9]{12}|3[47][0-9]{13}|3(?:0[0-5]|[68][0-9])[0-9]{11}|(?:2131|1800|35\\d{3})\\d{11})\\b"
    weight: 8
    type: "Financial"
  crypto_wallet:
    pattern: "\\b(bc1|[13])[a-zA-HJ-NP-Z0-9]{25,39}\\b|\\b0x[a-fA-F0-9]{40}\\b"
    weight: 7
    type: "Crypto"

engine:
  entropy_threshold: 4.5
  entropy_weight: 5

behavior:
  polling_window_seconds: 60
  max_accesses_per_window: 20
  isolation_forest_contamination: 0.05
